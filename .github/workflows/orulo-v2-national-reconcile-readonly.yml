name: Orulo V2 - national target reconciliation (read-only)
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  reconcile:
    if: ${{ github.repository == 'mudeisp/ynteligencia' && github.ref == 'refs/heads/main' && github.actor == 'mudeisp' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    environment: orulo-v2-reconciliation
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Reconcile verified source with live target (no writes)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PRIVATE_KEY: ${{ secrets.ORULO_V2_PRIVATE_KEY_PEM }}
          ORULO_V2_DB_URL: ${{ secrets.ORULO_V2_DB_URL }}
        run: |
          set -euo pipefail
          set +x
          umask 077
          test -n "$PRIVATE_KEY" || { echo "::error::ORULO_V2_PRIVATE_KEY_PEM_MISSING"; exit 1; }
          test -n "$ORULO_V2_DB_URL" || { echo "::error::ORULO_V2_DB_URL_MISSING"; exit 1; }
          WORK="$(mktemp -d)"
          trap 'rm -rf -- "$WORK"' EXIT
          printf '%s\n' "$PRIVATE_KEY" > "$WORK/key.pem"
          unset PRIVATE_KEY
          openssl pkey -in "$WORK/key.pem" -noout >/dev/null
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/mudeisp/ynteligencia/actions/artifacts/13790874062/zip" \
            -o "$WORK/manifest-artifact.zip"
          python3 - "$WORK" <<'PY'
          from pathlib import Path
          import sys,zipfile
          work=Path(sys.argv[1])
          with zipfile.ZipFile(work/'manifest-artifact.zip') as z:
              files=z.namelist()
              assert files==['recovery-manifest.cms'], 'UNEXPECTED_ARTIFACT_MEMBERS'
              (work/'recovery-manifest.cms').write_bytes(z.read(files[0]))
          PY
          openssl cms -decrypt -binary -inform DER -in "$WORK/recovery-manifest.cms" \
            -inkey "$WORK/key.pem" -out "$WORK/manifest.json"
          echo "6f6248375b5d5459496465d1c202e38e10adfade30bdef2442a7d59f00f313cc  $WORK/manifest.json" | sha256sum -c --status
          python3 -m pip install --disable-pip-version-check --quiet 'psycopg[binary]==3.2.12'
          python3 scripts/orulo-v2-reconcile-target-readonly.py "$WORK/manifest.json" "$WORK/target-reconciliation.json"
          openssl req -new -x509 -key "$WORK/key.pem" -out "$WORK/cert.pem" \
            -subj "/CN=orulo-v2-target-reconciliation" -days 1 >/dev/null 2>&1
          openssl cms -encrypt -binary -aes-256-cbc \
            -in "$WORK/target-reconciliation.json" -outform DER \
            -out "$WORK/target-reconciliation.cms" "$WORK/cert.pem"
          mkdir -p "$GITHUB_WORKSPACE/secure-output"
          cp "$WORK/target-reconciliation.cms" "$GITHUB_WORKSPACE/secure-output/target-reconciliation.cms"
      - name: Upload encrypted reconciliation evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: orulo-v2-target-reconciliation-encrypted
          path: secure-output/target-reconciliation.cms
          retention-days: 7
          if-no-files-found: error
