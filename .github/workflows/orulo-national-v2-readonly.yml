name: Orulo National V2 - operational read-only
on:
  workflow_dispatch:
    inputs:
      stage:
        description: Preflight, circuito nacional ou descoberta isolada da API Orulo
        type: choice
        default: preflight
        options: [preflight, national-readonly, source-discovery]
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/orulo-national-v2-readonly.yml'
      - 'scripts/orulo-national-*'
      - 'orulo-national-v2/**'
permissions:
  contents: read
concurrency:
  group: orulo-national-v2-readonly
  cancel-in-progress: false
jobs:
  verify-package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ca2df52153f9dcc50b9fda80a3aca6e7ea68f32f
          persist-credentials: false
      - name: Verify pinned source integrity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "ca2df52153f9dcc50b9fda80a3aca6e7ea68f32f"
          sha256sum -c <<'PINNED_SHA256'
          aacdcce0695829cb6ee917e3b7551fa0cdacef3826f4a8825005a2922fdb4a41  scripts/orulo-national-v2-pg-preflight.py
          b88be1cea2f68f5913811348423453948ce2113dd6cfb90d120d3670450516e3  scripts/orulo-national-v2-workflow.test.py
          9c37d4fea3fc96d8b3f51a72c0c93173556efe6931fc22717baff03a2c033f43  orulo-national-v2/handoff/PACKAGE-SHA256SUMS
          PINNED_SHA256
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify original V2 package and hashes
        shell: bash
        run: |
          set -euo pipefail
          test -f scripts/orulo-national-operational-readonly.sh || { echo "::error::BLOCKER_ORIGINAL_RUNNER_NOT_COMMITTED"; exit 1; }
          test -f orulo-national-v2/handoff/PACKAGE-SHA256SUMS || { echo "::error::BLOCKER_ORIGINAL_PACKAGE_NOT_COMMITTED"; exit 1; }
          sha256sum -c orulo-national-v2/handoff/PACKAGE-SHA256SUMS
          (cd orulo-national-v2 && sha256sum -c REVIEW-SHA256SUMS)
          (cd orulo-national-v2/manifest && sha256sum -c manifest.sha256)
          (cd orulo-national-v2/handoff && sha256sum -c source-queue.sha256)
          python3 scripts/orulo-national-v2.py verify orulo-national-v2
      - name: Install original locked local test dependency
        run: npm ci --prefix test-support/orulo-cas --ignore-scripts
      - name: Run original protocol and transfer tests without production credentials
        shell: bash
        run: |
          set -euo pipefail
          npm test --prefix test-support/orulo-cas
          node --test scripts/orulo-national-transfer.test.mjs scripts/orulo-national-readonly-sql.test.mjs
          python3 scripts/orulo-national-export-readonly.test.py
          python3 scripts/orulo-national-v2.test.py
          python3 scripts/orulo-national-v2-workflow.test.py
          bash -n scripts/orulo-national-operational-readonly.sh
  national-readonly:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' && inputs.stage != 'source-discovery' && github.ref == 'refs/heads/main' &&
          github.repository == 'mudeisp/ynteligencia' && github.actor == 'mudeisp' &&
          github.actor_id == '323805541' && github.triggering_actor == 'mudeisp' &&
          github.run_attempt == '1' }}
    needs: verify-package
    runs-on: ubuntu-latest
    environment: orulo-lote1
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ca2df52153f9dcc50b9fda80a3aca6e7ea68f32f
          persist-credentials: false
      - name: Verify pinned source integrity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "ca2df52153f9dcc50b9fda80a3aca6e7ea68f32f"
          sha256sum -c <<'PINNED_SHA256'
          aacdcce0695829cb6ee917e3b7551fa0cdacef3826f4a8825005a2922fdb4a41  scripts/orulo-national-v2-pg-preflight.py
          b88be1cea2f68f5913811348423453948ce2113dd6cfb90d120d3670450516e3  scripts/orulo-national-v2-workflow.test.py
          9c37d4fea3fc96d8b3f51a72c0c93173556efe6931fc22717baff03a2c033f43  orulo-national-v2/handoff/PACKAGE-SHA256SUMS
          PINNED_SHA256
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify original package before requesting any source
        run: sha256sum -c orulo-national-v2/handoff/PACKAGE-SHA256SUMS
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Validate dependencies then run the original operational circuit
        shell: bash
        env:
          ORULO_V2_STAGE: ${{ inputs.stage }}
          ORULO_CLIENT_ID: ${{ secrets.ORULO_CLIENT_ID }}
          ORULO_CLIENT_SECRET: ${{ secrets.ORULO_CLIENT_SECRET }}
          ORULO_V2_PG_SERVICE_CONF: ${{ secrets.ORULO_V2_PG_SERVICE_CONF }}
          ORULO_V2_PGPASS: ${{ secrets.ORULO_V2_PGPASS }}
        run: |
          set -euo pipefail
          test -n "$ORULO_CLIENT_ID" && test -n "$ORULO_CLIENT_SECRET" || { echo "::error::BLOCKER_ORULO_AUTH"; exit 1; }
          test -n "$ORULO_V2_PG_SERVICE_CONF" && test -n "$ORULO_V2_PGPASS" || { echo "::error::BLOCKER_READONLY_PG_PROFILE"; exit 1; }
          umask 077
          export PGSERVICEFILE="$RUNNER_TEMP/orulo-v2-pg/pg_service.conf"
          export PGPASSFILE="$RUNNER_TEMP/orulo-v2-pg/pgpass"
          export PGCONNECT_TIMEOUT=15
          if ! python3 scripts/orulo-national-v2-pg-preflight.py; then
            # Diagnostic is read-only and prints fixed categories only, never libpq stderr.
            python3 - <<'PY'
          import os, subprocess
          try:
              p = subprocess.run(
                  ['psql', 'service=orulo_v2_readonly', '-X', '-w', '-qAt',
                   '-v', 'ON_ERROR_STOP=1', '-c', 'SELECT 1'],
                  capture_output=True, text=True, timeout=25, env=os.environ)
              err = p.stderr.lower()
              if p.returncode == 0:
                  code = 'PG_CONNECT_OK_PREFLIGHT_SQL_FAILED'
              elif 'password authentication failed' in err or 'no password supplied' in err or 'fe_sendauth' in err:
                  code = 'PG_AUTH_PASSWORD_OR_PGPASS'
              elif 'tenant or user not found' in err or 'invalid tenant' in err:
                  code = 'PG_POOLER_TENANT_OR_USER'
              elif 'could not translate host name' in err or 'name or service not known' in err:
                  code = 'PG_DNS_FAILURE'
              elif 'timeout' in err or 'timed out' in err:
                  code = 'PG_NETWORK_TIMEOUT'
              elif 'connection refused' in err or 'network is unreachable' in err or 'no route to host' in err:
                  code = 'PG_NETWORK_UNREACHABLE'
              elif 'no pg_hba.conf entry' in err or 'ssl' in err or 'certificate' in err:
                  code = 'PG_TLS_OR_ACCESS_POLICY'
              elif 'role ' in err and 'does not exist' in err:
                  code = 'PG_ROLE_NOT_FOUND'
              elif 'permission denied' in err:
                  code = 'PG_PERMISSION_DENIED'
              else:
                  code = 'PG_CONNECTION_OTHER'
          except subprocess.TimeoutExpired:
              code = 'PG_NETWORK_TIMEOUT'
          except OSError:
              code = 'PG_CLIENT_EXECUTION_ERROR'
          print('::error::ORULO_V2_SAFE_CONNECTION_DIAGNOSTIC=' + code)
          PY
            # On successful authentication, compare frozen manifest against live hashes.
            # No row content, UUID, or credential is emitted or uploaded.
            python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          manifest = json.loads(Path('orulo-national-v2/manifest/national-v2.json').read_text())
          expected = {str(x['id']): str(x['recordSha256']) for x in manifest['properties']}
          sql = """BEGIN READ ONLY;
          SET LOCAL search_path = pg_catalog;
          SELECT id::text || E'\\t' || encode(sha256(convert_to(to_jsonb(p)::text,'UTF8')),'hex')
          FROM public.properties p
          WHERE source='novos' AND external_id LIKE 'orulo:%' ORDER BY id;
          COMMIT;"""
          try:
              p = subprocess.run(['psql','service=orulo_v2_readonly','-X','-w','-qAt',
                  '-v','ON_ERROR_STOP=1'],input=sql,text=True,capture_output=True,
                  timeout=100,env=os.environ)
              if p.returncode:
                  print('::error::ORULO_V2_RECONCILIATION=QUERY_FAILED')
              else:
                  lines = p.stdout.splitlines()
                  if not lines:
                      raise ValueError('EMPTY_RESULT')
                  current = {}
                  for line in lines:
                      parts = line.split()
                      if len(parts) != 2 or len(parts[1]) != 64:
                          raise ValueError('MALFORMED_RESULT')
                      if parts[0] in current:
                          raise ValueError('DUPLICATE_ID')
                      current[parts[0]] = parts[1]
                  if len(current) != len(lines):
                      raise ValueError('INCOMPLETE_RESULT')
                  added = current.keys() - expected.keys()
                  missing = expected.keys() - current.keys()
                  changed = {k for k in expected.keys() & current.keys() if expected[k]!=current[k]}
                  result = {'status':'READ_ONLY_RECONCILIATION','manifestCount':len(expected),
                      'currentCount':len(current),'newIds':len(added),'missingIds':len(missing),
                      'changedHashes':len(changed),'unchanged':len(expected.keys() & current.keys())-len(changed),
                      'nationalDryRunStarted':False,'productionWrites':0}
                  print('ORULO_V2_RECONCILIATION_COUNTS='+json.dumps(result,sort_keys=True))
                  out = Path(os.environ['RUNNER_TEMP'])/'orulo-national-v2-reconciliation-summary.json'
                  out.write_text(json.dumps(result,sort_keys=True)+'\\n')
          except (OSError,ValueError,KeyError,subprocess.TimeoutExpired):
              print('::error::ORULO_V2_RECONCILIATION=UNAVAILABLE')
          PY
            exit 1
          fi
          if [ "$ORULO_V2_STAGE" = national-readonly ]; then
            bash scripts/orulo-national-operational-readonly.sh --service orulo_v2_readonly --output-dir "$RUNNER_TEMP/orulo-national-v2-output"
          fi
      - name: Remove temporary credential files
        if: always()
        shell: bash
        run: |
          rm -f -- "$RUNNER_TEMP/orulo-v2-pg/pg_service.conf" "$RUNNER_TEMP/orulo-v2-pg/pgpass"
      - name: Upload diagnostic summaries without credentials or full property records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: orulo-national-v2-readonly-summary-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/orulo-national-v2-dependency-status.json
            ${{ runner.temp }}/orulo-national-v2-reconciliation-summary.json
            ${{ runner.temp }}/orulo-national-v2-output/stage-results.tsv
            ${{ runner.temp }}/orulo-national-v2-output/source-console.txt
            ${{ runner.temp }}/orulo-national-v2-output/export-console.txt
            ${{ runner.temp }}/orulo-national-v2-output/simulation-console.txt
          if-no-files-found: ignore
          retention-days: 7

  source-discovery:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' && inputs.stage == 'source-discovery' &&
          github.ref == 'refs/heads/main' && github.repository == 'mudeisp/ynteligencia' &&
          github.actor == 'mudeisp' && github.actor_id == '323805541' &&
          github.triggering_actor == 'mudeisp' && github.run_attempt == '1' }}
    needs: verify-package
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ca2df52153f9dcc50b9fda80a3aca6e7ea68f32f
          persist-credentials: false
      - name: Verify frozen source queue and pinned package
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "ca2df52153f9dcc50b9fda80a3aca6e7ea68f32f"
          sha256sum -c orulo-national-v2/handoff/PACKAGE-SHA256SUMS
          (cd orulo-national-v2/manifest && sha256sum -c manifest.sha256)
          (cd orulo-national-v2/handoff && sha256sum -c source-queue.sha256)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Discover authenticated source only without Supabase or CAS
        id: discovery
        shell: bash
        env:
          ORULO_CLIENT_ID: ${{ secrets.ORULO_CLIENT_ID }}
          ORULO_CLIENT_SECRET: ${{ secrets.ORULO_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          test -n "$ORULO_CLIENT_ID" && test -n "$ORULO_CLIENT_SECRET" || { echo "::error::BLOCKER_ORULO_AUTH"; exit 1; }
          umask 077
          node scripts/orulo-national-source-readonly.mjs \
            --queue orulo-national-v2/handoff/source-queue.json \
            --queue-sha256 b6726aa08aca9673e4d76d10e405b071682b1c8ed88a8ce93a934392b814f11e \
            --max-buildings 100 \
            --output-dir "$RUNNER_TEMP/orulo-source-discovery"
      - name: Print safe discovery summary
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json,os,pathlib,collections
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'orulo-source-discovery/index.json'
          if not p.is_file():
              print('ORULO_SOURCE_DISCOVERY=NO_INDEX')
          else:
              x=json.loads(p.read_text())
              summary={'status':x.get('status'),'examinedBuildings':len(x.get('results',[])),
                'pendingBuildings':len(x.get('unexaminedBuildingIds',[])),
                'requests':x.get('requests',{}),'productionWrites':0,'realCASCalls':0,
                'sharedServiceBlocked':x.get('sharedServiceBlocked',False),
                'incidentCodes':dict(collections.Counter(
                    str(i.get('code','UNKNOWN')) for i in x.get('incidents',[]))),
                'incidentHttpStatuses':dict(collections.Counter(
                    str(i.get('httpStatus','UNKNOWN')) for i in x.get('incidents',[]) if i.get('httpStatus') is not None))}
              # Per-building incidents are sanitized to fixed code and HTTP status only.
              for r in x.get('results',[])[:3]:
                  rp=p.parent/'buildings'/str(r['buildingId'])/'result.json'
                  if rp.is_file():
                      b=json.loads(rp.read_text())
                      for i in b.get('incidents',[]):
                          code=str(i.get('code','UNKNOWN'))
                          if code not in ('SOURCE_CREDENTIALS_UNAVAILABLE','SOURCE_AUTH_HTTP_ERROR','SOURCE_AUTH_INVALID','SOURCE_NETWORK_OR_TIMEOUT','SOURCE_HTTP_ERROR','SOURCE_INVALID_JSON','SOURCE_INVALID_RESPONSE','SOURCE_INCOMPLETE_RESPONSE','SOURCE_EVIDENCE_ERROR'):
                              code='SOURCE_EVIDENCE_ERROR'
                          summary.setdefault('buildingIncidentCodes',[]).append({'code':code,'httpStatus':i.get('httpStatus'),'scope':i.get('scope')})
              print('ORULO_SOURCE_DISCOVERY='+json.dumps(summary,sort_keys=True))
          PY
