name: Adjust Paid Push Second Property

on:
  push:
    branches:
      - cursor/paid-click-experience-v1-rebuild

permissions:
  contents: write

jobs:
  adjust:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply focused UX adjustment
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('paid-click-experience.js')
          s = p.read_text()
          old = '''function valuePerceived(state) {
            if (!state.resultsShown) return false;
            if (state.propertiesSeen >= 2) return true;
            if (state.detailOpened && state.returnedToResults) return true;
            if (state.refined && (state.detailOpened || state.propertiesSeen >= 1)) return true;
            return false;
          }'''
          new = '''function valuePerceived(state) {
            if (!state.resultsShown) return false;
            return state.propertiesSeen >= 2;
          }'''
          assert old in s, 'valuePerceived block not found'
          s = s.replace(old, new, 1)
          old_copy = 'headline: "Quer que eu te avise quando aparecer outro imóvel como estes?"'
          new_copy = 'headline: "Quer que eu te avise quando aparecer uma nova opção dentro desta busca?"'
          assert old_copy in s, 'prompt copy not found'
          s = s.replace(old_copy, new_copy, 1)
          p.write_text(s)

          t = Path('paid-click-experience.test.js')
          x = t.read_text()
          old_test = "test('value before prompt',()=>{let s=exp();s=paid.reducePaidExperience(s,{type:'results_shown'});assert.equal(s.promptEligible,false);s=paid.reducePaidExperience(s,{type:'detail_opened',propertyId:'a'});assert.equal(s.promptEligible,false);s=paid.reducePaidExperience(s,{type:'returned_to_results'});assert.equal(s.promptEligible,true);});"
          new_test = "test('push only becomes eligible after two distinct properties',()=>{let s=exp();s=paid.reducePaidExperience(s,{type:'results_shown'});assert.equal(s.promptEligible,false);s=paid.reducePaidExperience(s,{type:'detail_opened',propertyId:'a'});assert.equal(s.promptEligible,false);s=paid.reducePaidExperience(s,{type:'returned_to_results'});assert.equal(s.promptEligible,false);s=paid.reducePaidExperience(s,{type:'detail_opened',propertyId:'b'});assert.equal(s.promptEligible,true);});"
          assert old_test in x, 'value test not found'
          x = x.replace(old_test, new_test, 1)
          old_modal = "test('prompt hidden over detail and returns after close',()=>{let s=exp();s=paid.reducePaidExperience(s,{type:'results_shown'});s=paid.reducePaidExperience(s,{type:'detail_opened',propertyId:'a'});s=paid.reducePaidExperience(s,{type:'returned_to_results'});s=paid.reducePaidExperience(s,{type:'prompt_shown'});assert.equal(paid.evaluatePushPrompt(s,{detailOpen:true}).visible,false);assert.equal(paid.evaluatePushPrompt(s,{detailOpen:false}).visible,true);});"
          new_modal = "test('prompt hidden over second property detail and returns after close',()=>{let s=exp();s=paid.reducePaidExperience(s,{type:'results_shown'});s=paid.reducePaidExperience(s,{type:'detail_opened',propertyId:'a'});s=paid.reducePaidExperience(s,{type:'returned_to_results'});s=paid.reducePaidExperience(s,{type:'detail_opened',propertyId:'b'});s=paid.reducePaidExperience(s,{type:'prompt_shown'});assert.equal(paid.evaluatePushPrompt(s,{detailOpen:true}).visible,false);assert.equal(paid.evaluatePushPrompt(s,{detailOpen:false}).visible,true);});"
          assert old_modal in x, 'modal test not found'
          x = x.replace(old_modal, new_modal, 1)
          marker = "test('Agora não remains explicit dismiss'"
          copy_test = "test('push copy describes the actual search alert',()=>{const c=paid.promptCopy();assert.equal(c.headline,'Quer que eu te avise quando aparecer uma nova opção dentro desta busca?');assert.equal(c.primary,'SIM, QUERO SER AVISADO');assert.equal(c.secondary,'Agora não');});\n"
          assert marker in x, 'test insertion marker not found'
          x = x.replace(marker, copy_test + marker, 1)
          t.write_text(x)
          PY
      - name: Focused tests
        run: |
          node --test paid-click-experience.test.js paid-click-proactive-ai.test.js
          git diff --check
      - name: Remove helper workflow and commit
        run: |
          rm -f .github/workflows/adjust-paid-push-second-property.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add paid-click-experience.js paid-click-experience.test.js .github/workflows/adjust-paid-push-second-property.yml
          git commit -m 'fix: ask paid push after second property'
          git push
