name: Órulo National CAS seal — isolated checkpoint tests

on:
  pull_request:
    paths:
      - 'supabase/orulo_national_seal_checkpoints_staging.sql'
      - 'supabase/orulo_national_seal_only_draft.sql'
      - 'supabase/orulo_national_seal_only_draft_rollback.sql'
      - 'scripts/orulo-national-*'
      - 'scripts/fixtures/orulo-national-checkpoint-pg-fixture.sql'
      - '.github/workflows/orulo-seal-checkpoint-staging.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-checkpoints:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Synthetic verifier and checkpoint coordinator tests
        run: |
          node --test scripts/orulo-national-seal-verifier.test.mjs
          node --test scripts/orulo-national-checkpoint-staging.test.mjs
          node --test scripts/orulo-national-frozen-attestation.test.mjs
      - name: Install local Postgres client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Build isolated historical-ledger fixture
        run: psql -X -v ON_ERROR_STOP=1 -f scripts/fixtures/orulo-national-checkpoint-pg-fixture.sql
      - name: Execute checkpoint staging migration ONLY on ephemeral PostgreSQL
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/orulo_national_seal_checkpoints_staging.sql
      - name: Real transaction, replay, tampering and rollback tests
        run: psql -X -v ON_ERROR_STOP=1 -f scripts/orulo-national-checkpoint-pg.test.sql
      - name: Install REVIEW-ONLY seal-only draft in disposable database
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/orulo_national_seal_only_draft.sql
      - name: Fail-closed seal-only SQL test (no historic ledger write)
        run: psql -X -v ON_ERROR_STOP=1 -f scripts/orulo-national-seal-only-pg.test.sql
      - name: Concurrent duplicate RPC replay test
        run: bash scripts/orulo-national-checkpoint-concurrency.sh
      - name: Positive full-size synthetic seal, atomic rollback and idempotent replay
        run: psql -X -v ON_ERROR_STOP=1 -f scripts/orulo-national-seal-only-positive-pg.test.sql
      - name: Concurrent replay of the one and only synthetic seal
        run: bash scripts/orulo-national-seal-only-concurrency.sh
      - name: Remove seal-only draft without touching historical events
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/orulo_national_seal_only_draft_rollback.sql
      - name: Test isolated rollback without touching frozen ledger
        run: |
          psql -X -v ON_ERROR_STOP=1 -f supabase/orulo_national_seal_checkpoints_staging_rollback.sql
          psql -X -v ON_ERROR_STOP=1 -At -c "SELECT COUNT(*) FROM orulo_audit.entries;" | grep -x 6240

  historical-manifest-attestation:
    # Existing checkpoint workflow, but a distinct, manually gated read-only job.
    # No migrations, SQL DML, national_control, seal or CAS are ever executed.
    if: >-
      ${{ github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/audit/orulo-national-seal-incremental-proof-v1' &&
          github.repository == 'mudeisp/ynteligencia' &&
          github.actor == 'mudeisp' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: orulo-v2-reconciliation
    permissions:
      contents: read
      actions: read
    concurrency:
      group: orulo-frozen-national-attestation-readonly
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install PostgreSQL client for restricted read-only ledger query
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Decrypt pinned original artifact, retrieve frozen ledger, attest only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PRIVATE_KEY: ${{ secrets.ORULO_V2_PRIVATE_KEY_PEM }}
          READ_ONLY_PG_URL: ${{ secrets.ORULO_V2_DB_URL }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$PRIVATE_KEY" && test -n "$READ_ONLY_PG_URL"
          WORK="$(mktemp -d)"
          trap 'rm -rf -- "$WORK"' EXIT
          printf '%s\n' "$PRIVATE_KEY" > "$WORK/key.pem"
          unset PRIVATE_KEY
          python3 - <<'PY' > "$WORK/pins"
          import json
          from pathlib import Path
          data=json.loads(Path('docs/orulo-national-v2-manifest-receipt.json').read_text())
          assert data['artifactId']==13818623539
          assert data['manifestSha256']=='ef04d42882f69166f5892efc0163a774814f5f26a7defeee83aa681efa725288'
          print(data['artifactId'])
          print(data['artifactSha256'])
          PY
          mapfile -t PINS < "$WORK/pins"
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/mudeisp/ynteligencia/actions/artifacts/${PINS[0]}/zip" \
            -o "$WORK/original.zip"
          printf '%s  %s\n' "${PINS[1]}" "$WORK/original.zip" | sha256sum -c --status
          python3 - "$WORK" <<'PY'
          from pathlib import Path
          import hashlib,sys,zipfile
          directory=Path(sys.argv[1])
          with zipfile.ZipFile(directory/'original.zip') as archive:
              assert set(archive.namelist())=={
                  'national-manifest.cms','national-manifest.cms.sha256','national-summary.json'
              }, 'ARTIFACT_STRUCTURE_DIVERGED'
              encrypted=archive.read('national-manifest.cms')
              expected=archive.read('national-manifest.cms.sha256').decode().split()[0]
              assert hashlib.sha256(encrypted).hexdigest()==expected,'CMS_HASH_MISMATCH'
              (directory/'manifest.cms').write_bytes(encrypted)
          PY
          openssl cms -decrypt -binary -inform DER -in "$WORK/manifest.cms" \
            -inkey "$WORK/key.pem" -out "$WORK/manifest.json"
          echo 'ef04d42882f69166f5892efc0163a774814f5f26a7defeee83aa681efa725288  '"$WORK/manifest.json" \
            | sha256sum -c --status
          # PostgreSQL connector is forced read-only; the command itself is SELECT only.
          export PGOPTIONS='-c default_transaction_read_only=on -c statement_timeout=120000'
          test "$(psql "$READ_ONLY_PG_URL" -X -qAt -v ON_ERROR_STOP=1 -c 'show transaction_read_only')" = 'on'
          psql "$READ_ONLY_PG_URL" -X -qAt -v ON_ERROR_STOP=1 -c "
            SELECT row_to_json(q)
              FROM (SELECT sequence, kind, event, hash
                    FROM orulo_audit.entries
                    WHERE run_uuid='1c8ec62a-9c38-41ac-8091-f1ceef98ca91'::uuid
                    ORDER BY sequence) q
          " > "$WORK/frozen-ledger.ndjson"
          node scripts/orulo-national-frozen-attestation.mjs \
            "$WORK/manifest.json" "$WORK/frozen-ledger.ndjson"
          echo 'Original artifact and frozen ledger read-only attestation passed.' >> "$GITHUB_STEP_SUMMARY"
