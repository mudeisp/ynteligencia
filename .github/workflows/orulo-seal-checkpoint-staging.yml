name: Órulo National CAS seal — isolated checkpoint tests

on:
  pull_request:
    paths:
      - 'supabase/orulo_national_seal_checkpoints_staging.sql'
      - 'scripts/orulo-national-*'
      - 'scripts/fixtures/orulo-national-checkpoint-pg-fixture.sql'
      - '.github/workflows/orulo-seal-checkpoint-staging.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-checkpoints:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Synthetic verifier and checkpoint coordinator tests
        run: |
          node --test scripts/orulo-national-seal-verifier.test.mjs
          node --test scripts/orulo-national-checkpoint-staging.test.mjs
      - name: Install local Postgres client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Build isolated historical-ledger fixture
        run: psql -X -v ON_ERROR_STOP=1 -f scripts/fixtures/orulo-national-checkpoint-pg-fixture.sql
      - name: Execute checkpoint staging migration ONLY on ephemeral PostgreSQL
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/orulo_national_seal_checkpoints_staging.sql
      - name: Real transaction, replay, tampering and rollback tests
        run: psql -X -v ON_ERROR_STOP=1 -f scripts/orulo-national-checkpoint-pg.test.sql
      - name: Concurrent duplicate RPC replay test
        run: bash scripts/orulo-national-checkpoint-concurrency.sh
