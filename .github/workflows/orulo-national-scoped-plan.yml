name: Orulo national scope PostgreSQL 17
on:
  push:
    branches: [feat/orulo-national-scoped-authorization]
  pull_request:
    paths:
      - 'supabase/migrations/*orulo_national_scoped_plan.sql'
      - 'supabase/migrations/*orulo_national_scope_lease.sql'
      - 'supabase/migrations/*orulo_national_scope_cas_guard.sql'
      - 'test-support/orulo-cas/*'
      - 'supabase/migrations/*orulo_national_scoped_snapshots.sql'
      - 'tests/orulo-national-scope-guard.sql'
      - 'tests/orulo-national-scoped-cas.sql'
      - 'tests/orulo-national-scope-lease.sql'
      - 'tests/orulo-national-scoped-plan.sql'
      - '.github/workflows/orulo-national-scoped-plan.yml'
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Test the frozen national scope in disposable PostgreSQL
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -Atc 'show server_version'
          psql -h 127.0.0.1 -U postgres -d postgres -f tests/orulo-national-scope-lease.sql

          python3 test-support/orulo-cas/emit-national-guard-fixture.py > "$RUNNER_TEMP/orulo-guard-fixture.sql"
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d postgres -f "$RUNNER_TEMP/orulo-guard-fixture.sql"
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d postgres -f supabase/migrations/20261116130000_orulo_national_scope_cas_guard.sql
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d postgres -f supabase/migrations/20261116133000_orulo_national_scoped_snapshots.sql
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d postgres -f tests/orulo-national-scope-guard.sql
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d postgres -f tests/orulo-national-scoped-cas.sql
