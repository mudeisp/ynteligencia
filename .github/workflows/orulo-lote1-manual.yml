name: Orulo Lote1 manual read-only preflight
on:
  workflow_dispatch: {}
permissions: {}
concurrency:
  group: orulo-lote1-production
  cancel-in-progress: false
jobs:
  gate:
    name: Verify manual access and protected Environment
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
      deployments: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.workflow_sha }}
          path: control
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Fail closed until storage and Environment protections are configured
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ORULO_STORAGE_READY: ${{ vars.ORULO_STORAGE_READY }}
        run: node control/scripts/orulo-media-recovery-actions.mjs github-gate
  storage:
    name: Private durable audit preflight (no backfill)
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: orulo-lote1
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.workflow_sha }}
          path: control
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 2fa6ec8b093346e1a2319e4c6833cdfb0c52825e
          path: approved-source
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Obtain short-lived AWS credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.ORULO_AWS_ROLE_ARN }}
          aws-region: ${{ vars.ORULO_AWS_REGION }}
          allowed-account-ids: ${{ vars.ORULO_AWS_ACCOUNT_ID }}
          role-session-name: orulo-l1-${{ github.run_id }}
          role-duration-seconds: 900
          retry-max-attempts: 1
          unset-current-credentials: true
          output-credentials: false
      - name: Verify private durable storage and secret presence only
        env:
          APPROVED_SOURCE_DIR: ${{ github.workspace }}/approved-source
          ORULO_STORAGE_READY: ${{ vars.ORULO_STORAGE_READY }}
          ORULO_AUDIT_BUCKET: ${{ vars.ORULO_AUDIT_BUCKET }}
          ORULO_AWS_ACCOUNT_ID: ${{ vars.ORULO_AWS_ACCOUNT_ID }}
          AWS_MAX_ATTEMPTS: '1'
          ORULO_CLIENT_ID: ${{ secrets.ORULO_CLIENT_ID }}
          ORULO_CLIENT_SECRET: ${{ secrets.ORULO_CLIENT_SECRET }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: node control/scripts/orulo-media-recovery-actions.mjs storage-preflight
      # Intentionally no backfill/write step. A green result proves read-only preparation only.
