name: Orulo Lote1 manual read-only preflight
on:
  workflow_dispatch: {}
permissions: {}
concurrency:
  group: orulo-lote1-production
  cancel-in-progress: false
jobs:
  gate:
    name: Verify owner dispatch and protected Environment
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
      deployments: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.workflow_sha }}
          path: control
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Fail closed until storage and Environment protections are configured
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ORULO_POSTGRES_AUDIT_READY: ${{ vars.ORULO_POSTGRES_AUDIT_READY }}
        run: node control/scripts/orulo-media-recovery-actions.mjs github-gate
  storage:
    name: Private PostgreSQL audit preflight (no backfill)
    needs: gate
    if: >-
      ${{ github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/main' &&
          github.actor == 'mudeisp' &&
          github.actor_id == '323805541' &&
          github.triggering_actor == 'mudeisp' &&
          github.run_attempt == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: orulo-lote1
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.workflow_sha }}
          path: control
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 2fa6ec8b093346e1a2319e4c6833cdfb0c52825e
          path: approved-source
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Revalidate owner dispatch before credentials
        env:
          ORULO_POSTGRES_AUDIT_READY: ${{ vars.ORULO_POSTGRES_AUDIT_READY }}
        run: node control/scripts/orulo-media-recovery-actions.mjs dispatch-gate
      - name: Verify private PostgreSQL audit and secret presence only
        env:
          APPROVED_SOURCE_DIR: ${{ github.workspace }}/approved-source
          ORULO_POSTGRES_AUDIT_READY: ${{ vars.ORULO_POSTGRES_AUDIT_READY }}
          ORULO_AUDIT_SUPABASE_URL: ${{ vars.ORULO_AUDIT_SUPABASE_URL }}
          ORULO_CLIENT_ID: ${{ secrets.ORULO_CLIENT_ID }}
          ORULO_CLIENT_SECRET: ${{ secrets.ORULO_CLIENT_SECRET }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: node control/scripts/orulo-media-recovery-actions.mjs storage-preflight
      # Intentionally no backfill/write step. A green result proves read-only preparation only.

