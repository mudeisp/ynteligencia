name: Orulo audit archive - isolated validation only
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/orulo-audit-archive/**'
      - 'orulo-national-v2/archive/**'
      - '.github/workflows/orulo-audit-archive-safe.yml'
permissions:
  contents: read
concurrency:
  group: orulo-archive-validation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  isolated-archive-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DRY_RUN: 'true'
      ORULO_TEST_CONTAINER: orulo-archive-isolated
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install pinned archive test dependencies
        run: python3 -m pip install -r scripts/orulo-audit-archive/requirements.txt
      - name: Start disposable PostgreSQL with no production credentials
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --rm --name "$ORULO_TEST_CONTAINER" --label orulo.archive.isolated=true -e POSTGRES_HOST_AUTH_METHOD=trust -p 127.0.0.1::5432 postgres:17.6@sha256:00bc86618629af00d2937fdc5a5d63db3ff8450acf52f0636ec813c7f4902929
          for attempt in $(seq 1 30); do
            if docker exec "$ORULO_TEST_CONTAINER" pg_isready -U postgres; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Test export, independent verification and real isolated restore
        run: python3 -m unittest discover -s scripts/orulo-audit-archive -p test_archive.py -v
      - name: Produce cleanup dry run from the observed inventory
        run: python3 scripts/orulo-audit-archive/cleanup.py docs/orulo-archive-inventory.json > "$RUNNER_TEMP/orulo-archive-dry-run.json"
      - name: Stop disposable PostgreSQL
        if: always()
        run: docker rm -f "$ORULO_TEST_CONTAINER" || true
