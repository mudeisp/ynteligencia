name: Orulo CAS concurrency
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/orulo-cas.yml'
      - '.github/workflows/orulo-lote1-manual.yml'
      - '.github/workflows/orulo-pilot-manual.yml'
      - '.github/workflows/orulo-batch-manual.yml'
      - 'supabase/migrations/*orulo_manifest_batches.sql'
      - 'scripts/orulo-media-recovery-batches/**'
      - 'supabase/orulo_media_cas.sql'
      - 'supabase/migrations/*orulo_postgres_audit.sql'
      - 'supabase/migrations/*orulo_paged_snapshots.sql'
      - 'supabase/migrations/*orulo_pilot_authorization.sql'
      - 'supabase/migrations/*orulo_pilot_indexed_targets.sql'
      - 'supabase/orulo_reconcile_41813891981.sql'
      - 'supabase/orulo_reconcile_41832262256.sql'
      - 'supabase/orulo_reconcile_41840098939.sql'
      - 'scripts/orulo-media-cas*'
      - 'scripts/orulo-media-recovery*'
      - 'orulo-floor-plans*'
      - 'test-support/orulo-cas/**'
      - 'supabase/migrations/*orulo_webhook_provenance.sql'
      - 'scripts/orulo-webhook-provenance*'
      - 'scripts/orulo-v9-scram-staging-smoke.sh'
      - 'lib/orulo-webhook-core.js'
      - 'lib/orulo-webhook-provenance.js'
      - 'scripts/orulo-v9-staging*'
      - 'test-support/orulo-v9-staging/**'
permissions:
  contents: read
concurrency:
  group: orulo-cas-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  cas:
    name: CAS isolated PostgreSQL tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install locked test dependency
        run: npm ci --prefix test-support/orulo-cas --ignore-scripts --no-audit --no-fund
      - name: Run existing CAS and diagnostic tests (no production credentials)
        run: npm test --prefix test-support/orulo-cas
      - name: Staging target guards and empty-schema bootstrap tests
        run: node --test scripts/orulo-v9-staging-guard.test.mjs scripts/orulo-v9-staging-schema.test.mjs scripts/orulo-v9-staging-http.test.mjs
  postgres:
    name: Durable WAL and multi-session concurrency
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17.6
        env:
          # Isolated disposable test database; no production secrets or credentials.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: orulo_audit_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d orulo_audit_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Run transactional concurrency tests against local PostgreSQL only
        env:
          ORULO_SYNTHETIC_PG: 'true'
          PGHOST: '127.0.0.1'
          PGPORT: '5432'
          PGUSER: postgres
          PGDATABASE: orulo_audit_test
        run: node --test scripts/orulo-media-recovery-pg-concurrency.test.mjs
      - name: V9 isolated transactional provenance, identity and spoofing tests
        env:
          ORULO_SYNTHETIC_PG: 'true'
          PGHOST: '127.0.0.1'
          PGPORT: '5432'
          PGDATABASE: orulo_v9_test
        run: node --test scripts/orulo-webhook-provenance.test.mjs
      - name: V9 webhook adapter and commercial payload regression
        run: node --test scripts/orulo-webhook-provenance-adapters.test.mjs inventory-coordinates.test.js


  v9-scram:
    name: V9 disposable SCRAM TLS identity smoke (not staging)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install locked staging-only PostgreSQL driver
        run: npm ci --prefix test-support/orulo-v9-staging --ignore-scripts --no-audit --no-fund
      - name: Validate real SCRAM, verify-full TLS and reconnection in disposable PostgreSQL
        env:
          ORULO_V9_POOL_HTTP_SMOKE: 'true'
          V9_STAGING_REPORT: ${{ runner.temp }}/orulo-v9-staging-report.json
        run: bash scripts/orulo-v9-scram-staging-smoke.sh
      - name: Publish synthetic validation measurements only
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: orulo-v9-synthetic-validation-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/orulo-v9-staging-report.json
            ${{ runner.temp }}/orulo-v9-staging-report.json.sha256
          if-no-files-found: error
          retention-days: 14
