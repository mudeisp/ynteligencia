name: Orulo V2 - national batch validation
on:
  push:
    branches: [feat/orulo-v2-cas-executor-v1]
  workflow_dispatch:
    inputs:
      prepare_pilot:
        description: Prepare five real targets only, without CAS or national dry run
        type: boolean
        default: false
      batch_size:
        type: number
        default: 2000
      batch_number:
        type: number
        default: 1
      dry_run:
        type: boolean
        default: true
      cas_writes_authorized:
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  postgres-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Exercise CAS against disposable PostgreSQL
        env:
          TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/postgres
        run: |
          python3 -m pip install --disable-pip-version-check 'psycopg[binary]==3.2.12' 'Pillow==12.2.0'
          python3 tests/orulo-v2-cas-batch.test.py
          python3 tests/orulo-v2-image-validation.test.py
  validate:
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 10
    needs: postgres-tests
    if: ${{ github.repository == 'mudeisp/ynteligencia' && github.actor == 'mudeisp' && ((github.event_name == 'workflow_dispatch' && inputs.dry_run && !inputs.cas_writes_authorized && inputs.batch_size == 2000 && inputs.batch_number >= 1) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[prepare-five]'))) }}
    runs-on: ubuntu-latest
    environment: orulo-v2-reconciliation
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate pinned reconciliation batch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PRIVATE_KEY: ${{ secrets.ORULO_V2_PRIVATE_KEY_PEM }}
          ORULO_V2_DB_URL: ${{ secrets.ORULO_V2_DB_URL }}
          BATCH_NUMBER: ${{ inputs.batch_number || 1 }}
          TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/postgres
          PREPARE_PILOT: ${{ inputs.prepare_pilot || (github.event_name == 'push' && contains(github.event.head_commit.message, '[prepare-five]')) }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$PRIVATE_KEY" && test -n "$ORULO_V2_DB_URL"
          WORK="$(mktemp -d)"
          trap 'rm -rf -- "$WORK"' EXIT
          printf '%s\n' "$PRIVATE_KEY" > "$WORK/key.pem"
          unset PRIVATE_KEY
          openssl pkey -in "$WORK/key.pem" -noout >/dev/null
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/mudeisp/ynteligencia/actions/artifacts/13790874062/zip" \
            -o "$WORK/manifest-artifact.zip"
          python3 - "$WORK" <<'PY'
          from pathlib import Path
          import sys,zipfile
          work=Path(sys.argv[1])
          with zipfile.ZipFile(work/'manifest-artifact.zip') as z:
              files=z.namelist()
              assert files==['recovery-manifest.cms'], 'UNEXPECTED_ARTIFACT_MEMBERS'
              (work/'recovery-manifest.cms').write_bytes(z.read(files[0]))
          PY
          openssl cms -decrypt -binary -inform DER -in "$WORK/recovery-manifest.cms" \
            -inkey "$WORK/key.pem" -out "$WORK/manifest.json"
          echo "6f6248375b5d5459496465d1c202e38e10adfade30bdef2442a7d59f00f313cc  $WORK/manifest.json" | sha256sum -c --status
          python3 -m pip install --disable-pip-version-check --quiet 'psycopg[binary]==3.2.12' 'Pillow==12.2.0'
          # Validate the effective libpq host(s), including URI query overrides.
          python3 - <<'PY'
          import os,socket,sys
          from urllib.parse import urlsplit
          from psycopg.conninfo import conninfo_to_dict
          raw=os.environ["ORULO_V2_DB_URL"]
          try:
              parsed=urlsplit(raw)
              cfg=conninfo_to_dict(raw)
              hosts=[h.strip() for h in cfg.get("host","").split(",")]
              if not hosts or not all(hosts):
                  raise ValueError("EMPTY_LIBPQ_HOST")
              if any(h != parsed.hostname for h in hosts):
                  from urllib.parse import parse_qs
                  q=parse_qs(parsed.query,keep_blank_values=True)
                  if "host" in q or "hostaddr" in q:
                      raise ValueError("URI_QUERY_OVERRIDES_HOST_REMOVE_HOST_AND_HOSTADDR")
                  if parsed.password and any(ch in parsed.password for ch in "@:/?#"):
                      raise ValueError("URI_PASSWORD_MAY_REQUIRE_PERCENT_ENCODING")
                  raise ValueError("LIBPQ_HOST_DIFFERS_FROM_URI_HOST_CHECK_URI_ENCODING")
              if cfg.get("hostaddr"):
                  raise ValueError("UNEXPECTED_HOSTADDR_OVERRIDE")
              if len(hosts)!=1:
                  raise ValueError("MULTIPLE_LIBPQ_HOSTS")
              # Never print usernames, passwords, hostnames or full URI.
              expected="postgres.wzaegidwtdjuhqchpdpd"
              uri_user=parsed.username
              effective_user=cfg.get("user")
              if uri_user != expected:
                  raise ValueError("URI_USER_NOT_PROJECT_SCOPED")
              if effective_user != expected:
                  from urllib.parse import parse_qs
                  q=parse_qs(parsed.query,keep_blank_values=True)
                  if "user" in q:
                      raise ValueError("QUERY_USER_OVERRIDES_PROJECT_USER")
                  raise ValueError("LIBPQ_USER_DIFFERS_FROM_PROJECT_USER")
              print("LIBPQ_PROJECT_USER_VALIDATED=true",flush=True)
              socket.getaddrinfo(hosts[0],int(cfg.get("port") or 5432),type=socket.SOCK_STREAM)
              print("LIBPQ_EFFECTIVE_HOST_DNS_RESOLVED=true",flush=True)
          except (ValueError,TypeError,socket.gaierror) as exc:
              reason="LIBPQ_DNS_LOOKUP_FAILED" if isinstance(exc,socket.gaierror) else str(exc)
              print("::error::ORULO_V2_LIBPQ_PREFLIGHT:"+reason,file=sys.stderr)
              sys.exit(2)
          PY
          curl --fail --silent --location \
            --header "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/mudeisp/ynteligencia/actions/artifacts/13802730266/zip" \
            -o "$WORK/reconciliation.zip"
          python3 - "$WORK" <<'PY'
          from pathlib import Path
          import sys, zipfile
          work = Path(sys.argv[1])
          with zipfile.ZipFile(work / "reconciliation.zip") as archive:
              (work / "reconciliation.cms").write_bytes(archive.read("target-reconciliation.cms"))
          PY
          openssl cms -decrypt -binary -inform DER -in "$WORK/reconciliation.cms" \
            -inkey "$WORK/key.pem" -out "$WORK/reconciliation.json"
          python3 - "$WORK" <<'PY'
          import sys,os,subprocess,zipfile,hashlib,json,tarfile
          from pathlib import Path
          work=Path(sys.argv[1])
          artifacts=[
            (0,13764479763,'7b58d364cc024bf7de0d40068be116f88c61b132243858af83dfaf640dafb87e'),
            (1,13770122746,'4a2bebe0c6178ecb942e206ccef7d8e1a8859dc0dc1d17b693bd1e521c8f1a0e'),
            (2,13770564877,'f348c73505699ced2fb03372275fc0d63e3de81645418614529059ff47c8298d'),
            (3,13775147239,'647d43da3d8f1291033bb02faa49572b9c15ff45ca06b7c98ce4d55284c4cb44'),
            (4,13781323906,'90156adc363e2e32593b24970d5c97670e1a398e0e334af949127d66b9d5bd00'),
            (5,13782288400,'01887e757a825ef83498cd5e42248e391acf3e504b5e4bf3002949ecaec42fda'),
          ]
          for chunk,aid,digest in artifacts:
            dest=work/str(chunk);dest.mkdir()
            archive=dest/'artifact.zip'
            with archive.open('wb') as out:
              result=subprocess.run(['curl','--fail','--silent','--show-error','--location','--header',
                'Authorization: Bearer '+os.environ['GH_TOKEN'],
                '--header','Accept: application/vnd.github+json',
                f'https://api.github.com/repos/mudeisp/ynteligencia/actions/artifacts/{aid}/zip'],
                stdout=out,check=False)
              if result.returncode:
                raise SystemExit('CHECKPOINT_DOWNLOAD_FAILED')
            assert hashlib.sha256(archive.read_bytes()).hexdigest()==digest,'ARTIFACT_DIGEST_MISMATCH'
            with zipfile.ZipFile(archive) as z:
              names=set(z.namelist())
              assert {'source.cms','source.cms.sha256'}<=names,'ARTIFACT_FILES_MISSING'
              encrypted=z.read('source.cms')
              expected=z.read('source.cms.sha256').decode().split()[0]
              assert hashlib.sha256(encrypted).hexdigest()==expected,'CMS_DIGEST_MISMATCH'
            cms=dest/'source.cms';cms.write_bytes(encrypted)
            tgz=dest/'source.tgz'
            subprocess.run(['openssl','cms','-decrypt','-binary','-inform','DER','-in',str(cms),
              '-inkey',str(work/'key.pem'),'-out',str(tgz)],check=True,stdout=subprocess.DEVNULL)
          PY
          if [ "$PREPARE_PILOT" = "true" ]; then
            python3 scripts/orulo-v2-prepare-pilot.py "$WORK/manifest.json" "$WORK/reconciliation.json" "$WORK"
            openssl req -new -x509 -key "$WORK/key.pem" -out "$WORK/cert.pem" -subj "/CN=orulo-v2-five-proposal" -days 1 >/dev/null 2>&1
            mkdir -m 700 -p "$GITHUB_WORKSPACE/pilot-output"
            openssl cms -encrypt -binary -aes-256-cbc -in "$WORK/pilot-manifest.json" -outform DER -out "$GITHUB_WORKSPACE/pilot-output/pilot-manifest.cms" "$WORK/cert.pem"
            cp "$WORK/pilot-summary.json" "$GITHUB_WORKSPACE/pilot-output/"
          else
            python3 scripts/orulo-v2-national-dry-run.py "$WORK/manifest.json" "$WORK/reconciliation.json" "$BATCH_NUMBER" "$WORK"
          fi
      - name: Upload five-target proposal
        if: ${{ inputs.prepare_pilot || (github.event_name == 'push' && contains(github.event.head_commit.message, '[prepare-five]')) }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: orulo-v2-five-proposal-${{ github.run_id }}
          path: pilot-output/
          retention-days: 7
          if-no-files-found: error
